<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dobby Livre — conhecimento sem barreiras.">
  <title>Dobby Livre — conhecimento sem barreiras</title>
  <link rel="icon" href="/dobby-livre-logo.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="site-brand"><img src="/dobby-livre-logo.svg" alt="Dobby Livre — conhecimento sem barreiras"></header>
    <section class="controls" aria-label="Buscar e filtrar livros">
      <div class="search-row">
        <label class="search"><span aria-hidden="true">⌕</span><input id="busca" type="search" placeholder="Buscar livros, autores ou tags" aria-label="Buscar livros, autores ou tags"></label>
        <a class="add-book" href="/admin.html">Adicionar livro</a>
      </div>
      <div id="tags" class="tag-list" aria-label="Filtrar por tag"></div>
    </section>
    <section id="livros" class="book-grid" aria-live="polite"></section>
    <p id="vazio" class="empty" hidden>Nenhum livro encontrado.</p>
  </main>
</body>
</html>
