<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Dobby Livre — estudo de logo</title>
  <desc id="desc">Figura de orelhas largas lendo e erguendo uma meia, atravessando uma moldura interrompida com páginas em circulação.</desc>

  <defs>
    <style>
      .ink{stroke:#171614;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#171614;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Moldura-barreira interrompida -->
  <path d="M78 212V72H236" fill="none" stroke="#D43C2F" stroke-width="18"/>
  <path d="M402 72H520V208" fill="none" stroke="#171614" stroke-width="18"/>
  <path d="M78 352V552H242" fill="none" stroke="#171614" stroke-width="18"/>
  <path d="M370 552H520V374" fill="none" stroke="#D43C2F" stroke-width="18"/>

  <!-- Orelhas assimétricas -->
  <path d="M206 149C167 126 112 137 78 184C118 170 150 181 178 214C190 228 211 230 224 216Z"
        fill="#F4ECDD" class="ink"/>
  <path d="M318 145C351 119 405 126 443 168C404 156 374 169 343 202C331 215 312 216 299 205Z"
        fill="#F4ECDD" class="ink"/>

  <!-- Cabeça sem rosto -->
  <path d="M206 127C227 92 283 86 316 116C341 139 345 184 326 217C308 249 267 263 233 247C198 231 186 192 194 158C197 146 201 136 206 127Z"
        fill="#F4ECDD" class="ink"/>

  <!-- Pescoço e corpo com veste simplificada -->
  <path d="M238 249C240 273 232 282 214 292C184 309 177 352 188 418C220 439 317 439 350 418C362 351 354 309 321 292C303 282 296 272 297 246"
        fill="#F4ECDD" class="ink"/>
  <path d="M213 292C248 319 289 319 322 292M205 325C246 347 292 348 334 325M195 359C245 378 298 379 346 359"
        fill="none" class="fine"/>

  <!-- Braço que sustenta a leitura -->
  <path d="M199 312C168 321 150 348 149 386" fill="none" class="ink"/>

  <!-- Braço erguido cruzando a barreira -->
  <path d="M336 305C375 303 397 284 414 252C421 238 426 225 430 210" fill="none" class="ink"/>
  <path d="M426 211C426 196 437 187 451 191C465 196 470 211 465 225" fill="#F4ECDD" class="fine"/>

  <!-- Meia: sinal de liberdade -->
  <path d="M438 197C452 166 460 122 462 86L499 92C498 132 491 169 483 195C477 214 488 233 484 251C480 272 460 283 442 272C425 262 421 242 430 224C435 214 437 205 438 197Z"
        fill="#D43C2F" class="ink"/>

  <!-- Pernas e pés: figura de corpo inteiro -->
  <path d="M222 413C225 442 224 472 215 506" fill="none" class="ink"/>
  <path d="M312 413C309 444 312 474 322 506" fill="none" class="ink"/>
  <path d="M215 506C196 506 181 516 172 531C192 540 216 540 235 529" fill="#F4ECDD" class="ink"/>
  <path d="M322 506C341 506 357 516 366 531C345 540 321 540 302 529" fill="#F4ECDD" class="ink"/>

  <!-- Livro aberto -->
  <path d="M113 326C159 311 215 322 266 357V432C217 402 162 392 113 402Z"
        fill="#F4ECDD" class="ink"/>
  <path d="M266 357C315 321 374 311 422 327V403C370 392 316 403 266 432Z"
        fill="#F4ECDD" class="ink"/>
  <path d="M266 357V432" fill="none" class="fine"/>
  <path d="M144 352C179 348 212 355 241 371M142 379C177 377 207 385 236 399M291 372C324 355 360 348 393 352M296 399C326 384 357 377 390 379"
        fill="none" stroke="#171614" stroke-width="6" stroke-linecap="round"/>

  <!-- Páginas atravessando as aberturas da moldura -->
  <path d="M365 111L408 88L432 130L387 152Z" fill="#D43C2F" class="fine"/>
  <path d="M465 312L514 287L538 328L489 352Z" fill="#F4ECDD" class="fine"/>
  <path d="M502 261L548 239L568 277L523 298Z" fill="#F4ECDD" class="fine"/>
  <path d="M380 101L408 124M480 305L515 329M517 254L550 276" fill="none" stroke="#171614" stroke-width="5"/>

  <!-- Assinatura -->
  <g transform="translate(630 128)">
    <text x="0" y="48" fill="#D43C2F" font-family="Arial, Helvetica, sans-serif"
          font-size="27" font-weight="700" letter-spacing="7">REPOSITÓRIO ABERTO DE EDUCAÇÃO</text>
    <text x="-5" y="183" fill="#171614" font-family="Georgia, 'Times New Roman', serif"
          font-size="122" font-weight="700" letter-spacing="-5">Dobby Livre</text>
    <path d="M0 222H820" stroke="#171614" stroke-width="4"/>
    <text x="0" y="286" fill="#4B4842" font-family="Arial, Helvetica, sans-serif"
          font-size="38" letter-spacing="1.5">conhecimento sem barreiras</text>
    <path d="M0 334H122" stroke="#D43C2F" stroke-width="14"/>
    <text x="147" y="347" fill="#171614" font-family="Arial, Helvetica, sans-serif"
          font-size="25" font-weight="700" letter-spacing="4">LER · PARTILHAR · CIRCULAR</text>
  </g>
</svg>
