<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adicionar livro — Dobby Livre</title>
  <link rel="icon" href="/dobby-livre-logo.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <a class="admin-back" href="/">← Voltar para a biblioteca</a>
    <h1>Adicionar livro</h1>
    <p class="admin-intro">Envie o PDF, a capa e as informações que aparecerão no acervo.</p>
    <form id="form-livro" class="book-form">
      <label>Senha administrativa<input name="senha" type="password" autocomplete="current-password" required></label>
      <label>Título completo<input name="titulo" required></label>
      <label>Autoria<input name="autores" required placeholder="Separe autores por ponto e vírgula"></label>
      <div class="form-grid">
        <label>Tags<input name="tags" required placeholder="Separe por vírgulas"></label>
        <label>Ano<input name="ano" type="number" min="1000" max="2100"></label>
      </div>
      <label>Capa do livro<input name="capa" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <label>Documento em PDF<input name="pdf" type="file" accept="application/pdf" required></label>
      <button type="submit">Adicionar ao acervo</button>
      <p id="status" class="form-status" role="status"></p>
    </form>
  </main>
</body>
</html>
